# DersGym — Coolify Docker Compose deployment
# Builds directly from this Git repository with custom wellness, diet, supplements & feedback features.

services:
  api:
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
    volumes:
      - dersgym-data:/data
      - dersgym-coach-auth:/coach-auth

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
    ports:
      - "8080:80"

volumes:
  dersgym-data:
    name: dersgym_data
  dersgym-coach-auth:
    name: dersgym_coach_auth
